name: Build iPhone website app
on:
  push:
    branches: ['codex/iphone-native']
    paths: ['NevestaAgntsa-iPhone-source.zip']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iphone-site-build
  cancel-in-progress: true
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Unpack iPhone project
        run: unzip -o NevestaAgntsa-iPhone-source.zip 'iphone/*'
      - name: Build iPhone device package
        run: bash iphone/build.sh device
      - name: Build simulator package
        run: bash iphone/build.sh simulator
      - name: Verify live website in iPhone simulator
        run: bash iphone/smoke.sh
      - name: Upload installable package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NevestaAgntsa-iPhone
          path: build/NevestaAgntsa-iPhone.ipa
          if-no-files-found: warn
          retention-days: 30
      - name: Upload all page previews and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-preview
          path: build/preview/
          if-no-files-found: warn
          retention-days: 30
