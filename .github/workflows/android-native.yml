name: Build Android exact website app
'on':
  push:
    branches:
    - codex/iphone-native
    paths:
    - .github/workflows/android-native.yml
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: android-website-build
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Restore Android source snapshot
      run: |-
        python3 <<'PY'
        import json,base64,pathlib
        files=json.loads('{"android/build.sh": "", "android/README.md": "", "android/AndroidManifest.xml": "", "android/verify.py": "", "android/src/org/nevestaagntsa/android/MainActivity.java": "", "android/src/org/nevestaagntsa/android/Documents.java": "", "android/res/values/styles.xml": ""}')
        for name,data in files.items():
         p=pathlib.Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(data))
        PY
    - name: Reuse exact iPhone v5 offline website
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        gh run download 37149873946 --repo mirthsyrup/NevestaAgntsa --name NevestaAgntsa-iPhone --dir iphone-artifact
        python3 <<'PY'
        import zipfile,pathlib
        z=zipfile.ZipFile(next(pathlib.Path("iphone-artifact").glob("*.ipa")))
        prefix="Payload/NevestaAgntsa.app/Website/"
        for n in z.namelist():
         if n.startswith(prefix) and not n.endswith("/"):
          p=pathlib.Path("android/assets")/n[len(prefix):];p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(n))
        p=pathlib.Path("android/res/drawable/app_icon.png");p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read("Payload/NevestaAgntsa.app/AppIcon60x60@3x.png"))
        PY
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
        accept-android-sdk-licenses: false
    - name: Install Android build tools
      run: |-
        sdkmanager "platforms;android-35" "build-tools;35.0.0"
        python3 -m pip install websocket-client
        sudo chmod 666 /dev/kvm
    - name: Build universal APK
      run: |-
        bash android/build.sh
        zip -qr android/out/NevestaAgntsa-Android-source.zip android/AndroidManifest.xml android/src android/res android/assets android/build.sh android/verify.py android/README.md
    - name: Verify Android 13 offline, gestures and rotation
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 33
        target: google_apis
        arch: x86_64
        profile: pixel_5
        disable-animations: false
        script: |-
          adb install android/out/verification.apk
          adb shell svc wifi disable
          adb shell svc data disable
          adb shell am start -n org.nevestaagntsa.android/.MainActivity --ez verify true
          sleep 18
          python3 android/verify.py
    - name: Upload Android build
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: NevestaAgntsa-Android
        path: |-
          android/out/NevestaAgntsa-Android-unsigned.apk
          android/out/NevestaAgntsa-Android-source.zip
          android/out/apksigner.jar
    - name: Upload Android verification
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Android-preview
        path: android/preview/
